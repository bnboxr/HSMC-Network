name: Integration Tests

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - "tests/**"
      - "src/utils/**"
      - "vitest.integration.config.ts"
      - "package.json"
      - "bun.lock*"
      - ".github/workflows/test.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "server/**"
      - "tests/**"
      - "src/utils/**"
      - "vitest.integration.config.ts"
      - "package.json"
      - "bun.lock*"
      - ".github/workflows/test.yml"

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests
        run: bun run test:integration
        env:
          JWT_SECRET: "ci-test-jwt-secret-32bytes-minimum"
          HSMC_TEST_PORT: "13337"
          HSMC_TEST_DB_PATH: "/tmp/hsmc-ci-test.db"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            junit.xml
          retention-days: 7
