apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    /* Autolinking is configured via the ReactSettingsExtension in settings.gradle */
}

def enableProguardInReleaseBuilds = false

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.hsmc"
    defaultConfig {
        applicationId "com.hsmc.wallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    // No custom signingConfigs block: the debug variant is automatically signed
    // with AGP's default debug keystore (~/.android/debug.keystore), which AGP
    // creates on first build. The upstream RN template ships an app/debug.keystore
    // binary for the same purpose; relying on the AGP default avoids committing
    // a keystore and works on any fresh machine.
    buildTypes {
        debug {
            // Signed automatically with the default debug keystore.
        }
        release {
            // Caution: to produce an installable release APK, add a real
            // signingConfig here before publishing to an app store.
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // react-native-vector-icons: bundle icon fonts into the APK
    apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
}
