# HSMC Network — native Android wallet (Phase 1)
# Memory-safe settings for CI/dev machines. -Xmx2g keeps Gradle within
# modest memory budgets; the Android build itself runs in-process.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Cap parallel workers so CI/dev machines with modest RAM don't OOM.
org.gradle.workers.max=2
# Use AndroidX (required for Compose).
android.useAndroidX=true
# Non-transitive R classes keep the app slim.
android.nonTransitiveRClass=true
# Official Kotlin style.
kotlin.code.style=official
# Operator API key (x-api-key) for production /node-proxy access. Compile-time supply
# only; leave EMPTY for normal builds (the operator sets the key at runtime in Settings,
# stored AES-256-GCM in SecurePrefs). A real key must never be committed to source — set
# it in CI via secrets (-PHSMC_API_KEY=...) if a release should embed it.
HSMC_API_KEY=
