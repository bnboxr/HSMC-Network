# HSMC Network — native Android wallet (Phase 1)
# Memory-safe settings for CI/dev machines. -Xmx2g keeps Gradle within
# modest memory budgets; the Android build itself runs in-process.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Cap parallel workers so CI/dev machines with modest RAM don't OOM.
org.gradle.workers.max=2
# Use AndroidX (required for Compose).
android.useAndroidX=true
# Non-transitive R classes keep the app slim.
android.nonTransitiveRClass=true
# Official Kotlin style.
kotlin.code.style=official
