<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <!-- Dark blue metallic gradient for letters -->
    <linearGradient id="metalBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6ab4ff;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#2a7fd4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d4a8c;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#1a6bbf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#082e5e;stop-opacity:1" />
    </linearGradient>
    <!-- Inner highlight gradient -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a0d4ff;stop-opacity:0.6" />
      <stop offset="40%" style="stop-color:#4a9fe0;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0a3a70;stop-opacity:0" />
    </linearGradient>
    <!-- Red laser streak gradient -->
    <linearGradient id="laserRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff2200;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#ff4400;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ff6600;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#ff3300;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ff1100;stop-opacity:0" />
    </linearGradient>
    <!-- Blue laser streak gradient -->
    <linearGradient id="laserBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0044ff;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#0088ff;stop-opacity:0.7" />
      <stop offset="60%" style="stop-color:#00aaff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0" />
    </linearGradient>
    <!-- Red glow filter -->
    <filter id="redGlow" x="-50%" y="-500%" width="200%" height="1100%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Blue glow filter -->
    <filter id="blueGlow" x="-50%" y="-500%" width="200%" height="1100%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Letter shadow/depth -->
    <filter id="depth">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000820" flood-opacity="0.8"/>
    </filter>
    <!-- Outer glow on letters -->
    <filter id="letterGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#1a6bff" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="white"/>

  <!-- HSMC Text - bold italic metallic blue -->
  <text
    x="400"
    y="220"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="200"
    font-weight="900"
    font-style="italic"
    text-anchor="middle"
    fill="url(#metalBlue)"
    filter="url(#depth)"
    letter-spacing="-5"
  >HSMC</text>

  <!-- Highlight layer on text -->
  <text
    x="400"
    y="220"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="200"
    font-weight="900"
    font-style="italic"
    text-anchor="middle"
    fill="url(#highlight)"
    letter-spacing="-5"
    filter="url(#letterGlow)"
  >HSMC</text>

  <!-- Blue laser streak (bottom) -->
  <line x1="30" y1="178" x2="720" y2="165"
    stroke="url(#laserBlue)"
    stroke-width="2.5"
    filter="url(#blueGlow)"
  />

  <!-- Red laser main streak -->
  <line x1="40" y1="172" x2="760" y2="152"
    stroke="url(#laserRed)"
    stroke-width="3.5"
    filter="url(#redGlow)"
  />

  <!-- Red laser glow halo (wider, semi-transparent) -->
  <line x1="40" y1="172" x2="760" y2="152"
    stroke="#ff4400"
    stroke-width="10"
    opacity="0.25"
    filter="url(#redGlow)"
  />

  <!-- Red laser bright core -->
  <line x1="120" y1="169" x2="680" y2="155"
    stroke="#ffaa44"
    stroke-width="1.5"
    opacity="0.9"
  />
</svg>
